<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 420" width="880" height="420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="420" rx="10" fill="#ffffff"/>

  <!-- main basin: the shared base and its fine-tunes -->
  <ellipse cx="270" cy="215" rx="245" ry="180" fill="#0e7490" opacity="0.05"/>
  <ellipse cx="270" cy="215" rx="196" ry="142" fill="#0e7490" opacity="0.07"/>
  <ellipse cx="270" cy="215" rx="146" ry="104" fill="#0e7490" opacity="0.09"/>
  <ellipse cx="270" cy="215" rx="95"  ry="66"  fill="#0e7490" opacity="0.11"/>
  <text x="96" y="62" font-size="13" font-style="italic" fill="#0e7490">one low-loss basin</text>

  <!-- second basin: a model that did not start from θ₀ -->
  <ellipse cx="730" cy="200" rx="120" ry="100" fill="#6b7280" opacity="0.06"/>
  <ellipse cx="730" cy="200" rx="80"  ry="66"  fill="#6b7280" opacity="0.09"/>
  <text x="730" y="86" font-size="13" font-style="italic" fill="#6b7280" text-anchor="middle">another basin</text>
  <circle cx="730" cy="200" r="5" fill="#6b7280"/>
  <text x="730" y="226" font-size="13" font-weight="700" fill="#6b7280" text-anchor="middle">θ_other</text>
  <text x="730" y="244" font-size="11.5" fill="#6b7280" text-anchor="middle">trained from a different start</text>

  <!-- ridge between basins -->
  <path d="M540,70 C555,150 525,260 548,370" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="552" y="396" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">ridge of high loss</text>
  <text x="552" y="412" font-size="11" fill="#b91c1c" text-anchor="middle">averaging across it fails</text>

  <!-- shared base -->
  <circle cx="270" cy="215" r="5" fill="#6b7280"/>
  <text x="262" y="201" font-size="14" font-weight="700" fill="#6b7280" text-anchor="end">θ₀</text>

  <!-- task vectors: unequal lengths, different directions -->
  <line x1="270" y1="215" x2="360" y2="152" stroke="#b45309" stroke-width="2.6" marker-end="url(#ar)"/>
  <line x1="270" y1="215" x2="353" y2="273" stroke="#15803d" stroke-width="2.6" marker-end="url(#ar)"/>
  <line x1="270" y1="215" x2="139" y2="263" stroke="#1d4ed8" stroke-width="2.6" marker-end="url(#ar)"/>
  <circle cx="360" cy="152" r="5" fill="#b45309"/>
  <circle cx="353" cy="273" r="5" fill="#15803d"/>
  <circle cx="139" cy="263" r="5" fill="#1d4ed8"/>

  <text x="371" y="151" font-size="13.5" font-weight="700" fill="#b45309">θ_B  (City B)</text>
  <text x="364" y="281" font-size="13.5" font-weight="700" fill="#15803d">θ_K  (City K)</text>
  <text x="60" y="289" font-size="13.5" font-weight="700" fill="#1d4ed8">θ_C  (City C)</text>

  <text x="308" y="173" font-size="13" font-weight="700" fill="#b45309">τ_B</text>
  <text x="292" y="264" font-size="13" font-weight="700" fill="#15803d">τ_K</text>
  <text x="195" y="231" font-size="13" font-weight="700" fill="#1d4ed8">τ_C</text>

  <!-- merged point -->
  <line x1="270" y1="215" x2="281" y2="227" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <path d="M284,218 l2.6,5.3 5.9,0.9 -4.3,4.1 1,5.8 -5.2,-2.7 -5.2,2.7 1,-5.8 -4.3,-4.1 5.9,-0.9 z" fill="#b91c1c"/>
  <text x="299" y="227" font-size="13" font-weight="700" fill="#b91c1c">θ* merged</text>
</svg>
