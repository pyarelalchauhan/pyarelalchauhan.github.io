<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 620 288" width="620" height="288" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="620" height="288" rx="10" fill="#ffffff"/>
    <!-- edges with weight labels: W row i feeds output i -->
    <g stroke="#9aa1ab" stroke-width="1.6">
      <line x1="88" y1="80"  x2="402" y2="60"/>
      <line x1="88" y1="170" x2="402" y2="60"/>
      <line x1="88" y1="80"  x2="402" y2="125"/>
      <line x1="88" y1="170" x2="402" y2="125"/>
      <line x1="88" y1="80"  x2="402" y2="190"/>
      <line x1="88" y1="170" x2="402" y2="190"/>
    </g>
    <!-- weight labels (white halo + value), each one IS a parameter -->
    <g font-size="12.5" font-weight="700" fill="#0e7490" text-anchor="middle">
      <rect x="234" y="59"  width="56" height="16" fill="#fff" opacity="0.9"/><text x="262" y="72">0.2</text>
      <rect x="294" y="81"  width="56" height="16" fill="#fff" opacity="0.9"/><text x="322" y="94">−0.1</text>
      <rect x="234" y="95"  width="56" height="16" fill="#fff" opacity="0.9"/><text x="262" y="108">0.0</text>
      <rect x="294" y="128" width="56" height="16" fill="#fff" opacity="0.9"/><text x="322" y="141">0.5</text>
      <rect x="294" y="149" width="56" height="16" fill="#fff" opacity="0.9"/><text x="322" y="162">0.3</text>
      <rect x="234" y="171" width="56" height="16" fill="#fff" opacity="0.9"/><text x="262" y="184">0.3</text>
    </g>
    <!-- input nodes -->
    <circle cx="70" cy="80"  r="19" fill="#f0f0f0" stroke="#6b7280" stroke-width="1.6"/>
    <circle cx="70" cy="170" r="19" fill="#f0f0f0" stroke="#6b7280" stroke-width="1.6"/>
    <text x="70" y="85"  font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle">x₁</text>
    <text x="70" y="175" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle">x₂</text>
    <text x="70" y="215" font-size="11.5" fill="#5b6472" text-anchor="middle">2 inputs</text>
    <!-- output nodes with biases -->
    <circle cx="421" cy="60"  r="19" fill="#fff" stroke="#0e7490" stroke-width="2"/>
    <circle cx="421" cy="125" r="19" fill="#fff" stroke="#0e7490" stroke-width="2"/>
    <circle cx="421" cy="190" r="19" fill="#fff" stroke="#0e7490" stroke-width="2"/>
    <text x="421" y="65"  font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle">y₁</text>
    <text x="421" y="130" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle">y₂</text>
    <text x="421" y="195" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle">y₃</text>
    <text x="421" y="228" font-size="11.5" fill="#5b6472" text-anchor="middle">3 neurons</text>
    <g font-size="12.5" font-weight="700" fill="#6d28d9">
      <text x="452" y="64">b₁ = 0.1</text>
      <text x="452" y="129">b₂ = 0.0</text>
      <text x="452" y="194">b₃ = −0.2</text>
    </g>
    <!-- takeaway -->
    <text x="310" y="252" font-size="12.5" fill="#1f2430" text-anchor="middle">every number drawn on this picture is one <tspan font-weight="800">parameter</tspan>:
      <tspan fill="#0e7490" font-weight="700">6 weights</tspan> + <tspan fill="#6d28d9" font-weight="700">3 biases</tspan> = 9</text>
    <text x="310" y="274" font-size="12" fill="#5b6472" text-anchor="middle">each circle on the right is a neuron: it collects its 2 weighted inputs, adds its own bias, squashes the sum</text>
  </svg>
